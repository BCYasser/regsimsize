# Adapted from https://github.com/r-lib/actions/tree/v2/examples
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_FORCE_SUGGESTS_: "true"
      _R_CHECK_CRAN_INCOMING_: "true"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "true"
      REGSIMSIZE_TEST_PARALLEL: "true"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::tinytex
            any::V8
          needs: check
      - name: Install HTML validator (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tidy
      - name: Install HTML validator (macOS)
        if: runner.os == 'macOS'
        run: brew list tidy-html5 || brew install tidy-html5
      - name: Install reference-manual fonts
        shell: Rscript {0}
        run: |
          tinytex::tlmgr_install(c("inconsolata", "helvetic", "courier", "times",
                                  "ae", "fancyvrb", "upquote"))
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--as-cran")'
          build_args: 'character()'
          error-on: '"warning"'
          upload-results: "true"
          artifact-name: ${{ matrix.config.os }}-${{ matrix.config.r }}-check
